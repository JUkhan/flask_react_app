services:
  angular:
    build:
      context: ./angular
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    networks:
      - app-network

  # react:
  #   build:
  #     context: ./react
  #     dockerfile: Dockerfile
  #   ports:
  #     - "3000:80"
  #   networks:
  #     - app-network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    networks:
      - app-network
    depends_on:
      - mssql
    environment:
      - DATABASE_URL=mssql+pyodbc://sa:pass123!@mssql:1433/master?driver=ODBC+Driver+17+for+SQL+Server&TrustServerCertificate=yes
      - SCHEMA=dbo

  mssql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: mssql_server
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=pass123!
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - app-network
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P pass123! -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

networks:
  app-network:
    driver: bridge

volumes:
  mssql_data:
